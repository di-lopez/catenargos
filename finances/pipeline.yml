resources:
  jobs:
    dbt_finances:
      name: dbt_finances
      tags:
        finances: finances
      schedule:
        quartz_cron_expression: "0 0 18 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
          - "${var.email}"
      tasks:
        - task_key: dbt_build
          dbt_task:
            project_directory: ${workspace.file_path}/finances/finances
            commands:
              - dbt deps
              - dbt build --select +finances+
            warehouse_id: ${var.warehouse_id}
            catalog: personal
            schema: finances
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies:
              - dbt-databricks

    statement_loader:
      name: statement_loader
      tags:
        finances: finances
        balance: balance
      trigger:
        file_arrival:
          url: "/Volumes/personal/raw/balance_statements/"

      email_notifications:
        on_failure:
          - "${var.email}"
        on_success:
          - "${var.email}"

      tasks:
        - task_key: process
          environment_key: env
          spark_python_task:
            python_file: ${workspace.file_path}/finances/finances/supporting/load_statement.py
            parameters:
              - "--catalog"
              - "personal"
              - "--schema"
              - "raw"
              - "--volume"
              - "balance_statements"
              - "--table"
              - "balance_statements"
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies:
              - loguru
              - openpyxl