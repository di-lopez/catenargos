resources:
  jobs:
    dbt_finances:
      name: dbt_finances
      schedule:
        quartz_cron_expression: "0 0 18 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      tasks:
        - task_key: dbt_build
          dbt_task:
            project_directory: ${workspace.file_path}/finances/finances
            commands:
              - dbt deps
              - dbt build
            warehouse_id: ${var.warehouse_id}
            catalog: personal
            schema: finances
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies:
              - dbt-databricks