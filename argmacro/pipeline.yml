resources:
  jobs:
    usdfx_job:
      name: fetch_usdfx
      schedule:
        quartz_cron_expression: "0 0 22 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      tasks:
        - task_key: usdmep
          environment_key: env
          spark_python_task:
            python_file: ${workspace.file_path}/argmacro/usdmep.py
            parameters:
              - "--catalog"
              - "personal"
              - "--schema"
              - "argmacro"
              - "--table"
              - "usdmep"
              - "--start"
              - ""
        - task_key: usdblue
          environment_key: env
          spark_python_task:
            python_file: ${workspace.file_path}/argmacro/usdblue.py
            parameters:
              - "--catalog"
              - "personal"
              - "--schema"
              - "argmacro"
              - "--table"
              - "usdblue"
              - "--start"
              - ""
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies:
              - loguru

    ipc_job:
      name: fetch_ipc
      schedule:
        quartz_cron_expression: "0 0 22 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      tasks:
        - task_key: ipc
          environment_key: env
          spark_python_task:
            python_file: ${workspace.file_path}/argmacro/ipc.py
            parameters:
              - "--catalog"
              - "personal"
              - "--schema"
              - "argmacro"
              - "--table"
              - "ipc"
              - "--date"
              - "{{job.start_time.iso_date}}"
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies:
              - loguru
              - xlrd

    ipc_views:
      name: create_ipc_views
      trigger:
        table_update:
          table_names:
            - personal.argmacro.ipc
      parameters:
        - name: catalog
          default: personal
        - name: schema
          default: argmacro
      tasks:
        - task_key: ipc_delta_m
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ${workspace.file_path}/argmacro/ipc_delta_m.sql
            parameters:
              catalog: '{{job.parameters.catalog}}'
              schema: '{{job.parameters.schema}}'
        - task_key: ipc_delta_y
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ${workspace.file_path}/argmacro/ipc_delta_y.sql
            parameters:
              catalog: '{{job.parameters.catalog}}'
              schema: '{{job.parameters.schema}}'

    isac_job:
      name: fetch_isac
      schedule:
        quartz_cron_expression: "0 0 22 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      tasks:
        - task_key: isac
          environment_key: env
          spark_python_task:
            python_file: ${workspace.file_path}/argmacro/isac.py
            parameters:
              - "--catalog"
              - "personal"
              - "--schema"
              - "argmacro"
              - "--table"
              - "isac"
              - "--date"
              - "{{job.start_time.iso_date}}"
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies:
              - loguru
              - xlrd

    icc_job:
      name: fetch_icc
      schedule:
        quartz_cron_expression: "0 0 22 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      tasks:
        - task_key: icc
          environment_key: env
          spark_python_task:
            python_file: ${workspace.file_path}/argmacro/icc.py
            parameters:
              - "--catalog"
              - "personal"
              - "--schema"
              - "silver"
              - "--table"
              - "icc"
              - "--date"
              - "{{job.start_time.iso_date}}"
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies:
              - loguru

    ipc_update_notifier:
      name: ipc_notifier
      trigger:
        table_update:
          table_names:
            - personal.argmacro.ipc
          min_time_between_triggers_seconds: 60
      email_notifications:
        on_success:
          - "${var.email}"
      parameters:
        - name: updated_table
          default: "{{job.trigger.table_update.updated_tables}}"
      tasks:
        - task_key: noop
          notebook_task:
            notebook_path: ${workspace.file_path}/argmacro/noop.py

    icc_update_notifier:
      name: icc_notifier
      trigger:
        table_update:
          table_names:
            - personal.argmacro.icc
          min_time_between_triggers_seconds: 60
      email_notifications:
        on_success:
          - "${var.email}"
      parameters:
        - name: updated_table
          default: "{{job.trigger.table_update.updated_tables}}"
      tasks:
        - task_key: noop
          notebook_task:
            notebook_path: ${workspace.file_path}/argmacro/noop.py

    isac_update_notifier:
      name: isac_notifier
      trigger:
        table_update:
          table_names:
            - personal.argmacro.isac
          min_time_between_triggers_seconds: 60
      email_notifications:
        on_success:
          - "${var.email}"
      parameters:
        - name: updated_table
          default: "{{job.trigger.table_update.updated_tables}}"
      tasks:
        - task_key: noop
          notebook_task:
            notebook_path: ${workspace.file_path}/argmacro/noop.py

    cpau_update_notifier:
      name: cpau_notifier
      trigger:
        table_update:
          table_names:
            - personal.argmacro.cpau
          min_time_between_triggers_seconds: 60
      email_notifications:
        on_success:
          - "${var.email}"
      parameters:
        - name: updated_table
          default: "{{job.trigger.table_update.updated_tables}}"
      tasks:
        - task_key: noop
          notebook_task:
            notebook_path: ${workspace.file_path}/argmacro/noop.py